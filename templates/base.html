<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GTFS Timetable Viewer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
  </head>
  <body>
    <header>
      <div class="header-content">
        <h1>GTFS Timetable Viewer</h1>
        <nav>
            <a
              class="{% if request.endpoint == 'index' or request.endpoint == 'timetable' %}active{% endif %}"
              href="{{ url_for('index') }}"
              >
              Timetable
            </a>
            <a
              class="{% if request.endpoint == 'transfers' %}active{% endif %}"
              href="{{ url_for('transfers') }}"
              >
              Transfers
            </a>
        </nav>
      </div>
    </header>

    <div class="container">
      {% if error %}
        <div class="error-message">
          <strong>Error:</strong> {{ error }}
        </div>
      {% endif %}

      {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
  </body>
</html>
